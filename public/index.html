<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IoT 温湿度可视化</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --card-2: #334155;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
    --temp: #f97316; --hum: #22d3ee; --ok: #22c55e; --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: var(--text); min-height: 100vh; padding: 24px;
  }
  header {
    max-width: 1100px; margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  h1 { margin: 0; font-size: 1.5rem; letter-spacing: 0.5px; }
  .tag {
    font-size: 0.8rem; padding: 4px 12px; border-radius: 999px;
    background: var(--card-2); color: var(--muted);
  }
  .tag.ok { color: var(--ok); }
  .tag.warn { color: var(--warn); }
  main { max-width: 1100px; margin: 0 auto; }
  .kpis {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 16px; margin-bottom: 20px;
  }
  .card {
    background: var(--card); border-radius: 14px; padding: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  }
  .card h2 { margin: 0 0 8px; font-size: 0.9rem; color: var(--muted); font-weight: 500; letter-spacing: 1px; }
  .big { font-size: 2.6rem; font-weight: 700; letter-spacing: -0.5px; }
  .unit { font-size: 1rem; color: var(--muted); margin-left: 4px; font-weight: 400; }
  .temp { color: var(--temp); }
  .hum  { color: var(--hum); }
  .meta { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
  .chart-card { padding: 16px 20px 20px; }
  canvas { display: block; width: 100%; height: 280px; }
  .legend { display: flex; gap: 24px; font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
  .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .footer-note {
    max-width: 1100px; margin: 16px auto 0; font-size: 0.8rem; color: var(--muted);
  }
</style>
</head>
<body>
  <header>
    <h1>🌡️ IoT 温湿度实时可视化</h1>
    <span id="connTag" class="tag warn">连接中…</span>
  </header>
  <main>
    <section class="kpis">
      <div class="card">
        <h2>设备</h2>
        <div class="big" id="deviceId">—</div>
        <div class="meta">最后更新：<span id="lastTs">—</span></div>
      </div>
      <div class="card">
        <h2>温度</h2>
        <div class="big temp"><span id="tempVal">—</span><span class="unit">°C</span></div>
        <div class="meta">来源：<span id="tempSrc">—</span></div>
      </div>
      <div class="card">
        <h2>湿度</h2>
        <div class="big hum"><span id="humVal">—</span><span class="unit">%</span></div>
        <div class="meta">来源：<span id="humSrc">—</span></div>
      </div>
    </section>

    <section class="card chart-card">
      <h2>最近 60 条趋势（约 2 分钟）</h2>
      <canvas id="trendChart"></canvas>
      <div class="legend">
        <span><span class="dot" style="background:#f97316"></span>温度 °C</span>
        <span><span class="dot" style="background:#22d3ee"></span>湿度 %</span>
      </div>
    </section>
  </main>
  <p class="footer-note">数据每 2 秒推送；无 MQTT broker 时自动使用内置模拟数据，保证页面可用。</p>

<script>
const MAX_POINTS = 60;
const tempData = [];   // 温度序列
const humData  = [];   // 湿度序列
const timeLabels = [];

// ---- 自绘 canvas 双 Y 轴折线图 ----
const canvas = document.getElementById('trendChart');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawChart();
}
window.addEventListener('resize', resizeCanvas);

function drawChart() {
  const w = canvas.getBoundingClientRect().width;
  const h = canvas.getBoundingClientRect().height;
  ctx.clearRect(0, 0, w, h);
  if (tempData.length === 0) return;

  const padL = 50, padR = 50, padT = 16, padB = 28;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;
  const n = tempData.length;

  // 范围
  const tMin = Math.min.apply(null, tempData) - 1, tMax = Math.max.apply(null, tempData) + 1;
  const hMin = Math.min.apply(null, humData)  - 2, hMax = Math.max.apply(null, humData)  + 2;
  const tRange = Math.max(0.1, tMax - tMin);
  const hRange = Math.max(0.1, hMax - hMin);

  const x = (i) => padL + (plotW * i) / Math.max(1, n - 1);
  const yT = (v) => padT + plotH * (1 - (v - tMin) / tRange);
  const yH = (v) => padT + plotH * (1 - (v - hMin) / hRange);

  // 网格 + X 轴刻度
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
  ctx.fillStyle = '#94a3b8'; ctx.font = '12px sans-serif';
  for (let i = 0; i <= 4; i++) {
    const yy = padT + (plotH * i) / 4;
    ctx.beginPath(); ctx.moveTo(padL, yy); ctx.lineTo(w - padR, yy); ctx.stroke();
  }
  const labelStep = Math.max(1, Math.floor(n / 8));
  for (let i = 0; i < n; i += labelStep) {
    ctx.fillText(timeLabels[i].slice(0, 5), x(i) - 18, h - 8);
  }

  // 左 Y 轴（温度 °C）
  ctx.fillStyle = '#f97316';
  ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH); ctx.stroke();
  for (let i = 0; i <= 4; i++) {
    const v = tMin + (tRange * i) / 4;
    const yy = padT + plotH * (1 - i / 4);
    ctx.fillText(v.toFixed(1), 4, yy + 4);
  }
  ctx.fillText('°C', 6, padT + 12);

  // 右 Y 轴（湿度 %）
  ctx.fillStyle = '#22d3ee';
  ctx.beginPath(); ctx.moveTo(w - padR, padT); ctx.lineTo(w - padR, padT + plotH); ctx.stroke();
  for (let i = 0; i <= 4; i++) {
    const v = hMin + (hRange * i) / 4;
    const yy = padT + plotH * (1 - i / 4);
    ctx.fillText(v.toFixed(1), w - padR + 6, yy + 4);
  }
  ctx.fillText('%', w - padR + 6, padT + 12);

  // 温度折线 + 填充
  ctx.fillStyle = 'rgba(249,115,22,0.12)';
  ctx.beginPath();
  ctx.moveTo(x(0), padT + plotH);
  for (let i = 0; i < n; i++) ctx.lineTo(x(i), yT(tempData[i]));
  ctx.lineTo(x(n - 1), padT + plotH); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#f97316'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < n; i++) { i === 0 ? ctx.moveTo(x(i), yT(tempData[i])) : ctx.lineTo(x(i), yT(tempData[i])); }
  ctx.stroke();

  // 湿度折线 + 填充
  ctx.fillStyle = 'rgba(34,211,238,0.12)';
  ctx.beginPath();
  ctx.moveTo(x(0), padT + plotH);
  for (let i = 0; i < n; i++) ctx.lineTo(x(i), yH(humData[i]));
  ctx.lineTo(x(n - 1), padT + plotH); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < n; i++) { i === 0 ? ctx.moveTo(x(i), yH(humData[i])) : ctx.lineTo(x(i), yH(humData[i])); }
  ctx.stroke();

  // 最新点高亮
  ctx.fillStyle = '#f97316';
  ctx.beginPath(); ctx.arc(x(n - 1), yT(tempData[n - 1]), 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#22d3ee';
  ctx.beginPath(); ctx.arc(x(n - 1), yH(humData[n - 1]), 4, 0, Math.PI * 2); ctx.fill();
}

function fmtTime(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}

function addPoint(reading, source) {
  timeLabels.push(fmtTime(reading.ts));
  tempData.push(reading.temperature);
  humData.push(reading.humidity);
  if (tempData.length > MAX_POINTS) { timeLabels.shift(); tempData.shift(); humData.shift(); }

  document.getElementById('deviceId').textContent = reading.deviceId || 'unknown';
  document.getElementById('tempVal').textContent = reading.temperature.toFixed(2);
  document.getElementById('humVal').textContent = reading.humidity.toFixed(2);
  document.getElementById('lastTs').textContent = fmtTime(reading.ts);
  const srcLabel = source === 'mqtt' ? 'MQTT broker' : '内置模拟';
  document.getElementById('tempSrc').textContent = srcLabel;
  document.getElementById('humSrc').textContent = srcLabel;

  drawChart();
}

// 先拉一次历史（页面刷新后恢复近 60 条）
fetch('/api/history')
  .then(r => r.json())
  .then(res => {
    if (res.data && res.data.length) res.data.forEach(r => addPoint(r, res.source));
    resizeCanvas();
    const tag = document.getElementById('connTag');
    tag.textContent = res.source === 'mqtt' ? '🟢 实时 (MQTT)' : '🟡 模拟';
    tag.className = 'tag ' + (res.source === 'mqtt' ? 'ok' : 'warn');
  })
  .catch(() => {});

// 实时推送
const es = new EventSource('/stream');
es.onmessage = (ev) => {
  try {
    const msg = JSON.parse(ev.data);
    addPoint(msg.data, msg.source);
    const tag = document.getElementById('connTag');
    tag.textContent = msg.source === 'mqtt' ? '🟢 实时 (MQTT)' : '🟡 模拟';
    tag.className = 'tag ' + (msg.source === 'mqtt' ? 'ok' : 'warn');
  } catch {}
};
es.onerror = () => {
  const tag = document.getElementById('connTag');
  tag.textContent = '🔴 断开，重连中…';
  tag.className = 'tag warn';
};
</script>
</body>
</html>
